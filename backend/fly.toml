# fly.toml app configuration file generated for ct-bridge-backend on 2026-08-02T20:40:04+07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ct-bridge-backend'
primary_region = 'sin'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
